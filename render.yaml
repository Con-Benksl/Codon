# Render Blueprint
# 部署：在 Render 控制台 New + → Blueprint → 选择本仓库 → 自动检测 render.yaml
# 详细步骤见 backend/RENDER_DEPLOY.md

services:
  - type: web
    name: codon-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: bash render-start.sh
    healthCheckPath: /health
    envVars:
      # Supabase Postgres URL（Render 控制台手动填，不在此处硬编码）
      - key: DATABASE_URL
        sync: false
      # Fail fast when the database URL or network is wrong.
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      # 用 openssl rand -hex 32 生成
      - key: SECRET_KEY
        sync: false
      # OpenAI-compatible API key
      - key: LLM_API_KEY
        sync: false
      # Optional OpenAI-compatible endpoint and model override.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # Optional: enable per-protein LLM explanations. Keep false for faster, lower-cost flow.
      - key: LLM_PROTEIN_EXPLANATIONS_ENABLED
        sync: false
      # 前端 Vercel 域名（部署后回来填）
      - key: CORS_ORIGINS
        sync: false
